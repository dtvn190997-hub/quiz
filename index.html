<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#221F20">
<title>METKRAFT Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#D31734;--ink:#221F20;--bg:#fff;--soft:#F4F4F5;--line:#DCDCE0;--mut:#6B6B72;--c0:#D31734;--c1:#221F20;--c2:#2466B0;--c3:#C97A00;--ok:#1E8E4E}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Montserrat,Inter,"Segoe UI",Arial,sans-serif;font-weight:500;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent}
#app{min-height:100%;display:flex;flex-direction:column}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:.01em}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:3px solid var(--ink)}
.brand{font-weight:900;font-size:20px;letter-spacing:.02em;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand b{color:var(--red);font-weight:900}
.brand span{font-size:11px;letter-spacing:.28em;margin-left:8px;padding:3px 7px;background:var(--ink);color:#fff;vertical-align:middle}
.sp{flex:1}
.btn{border:2px solid var(--ink);background:#fff;color:var(--ink);padding:9px 16px;border-radius:6px;font-weight:700;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.pri:hover{filter:brightness(.92)}
.btn.dark{background:var(--ink);color:#fff}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.big{padding:14px 28px;font-size:18px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:transparent}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:22px 18px}
.mut{color:var(--mut)}
.card{border:2px solid var(--line);border-radius:10px;padding:16px;background:#fff}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:6px;background:#fff}
.field:focus{outline:none;border-color:var(--ink)}
label.l{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin:12px 0 5px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft)}
.warn{background:#FFF4D6;border:2px solid #E0B040;padding:10px 14px;border-radius:8px;font-size:14px}
.banner{background:var(--ink);color:#fff;padding:12px 16px;border-radius:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99;max-width:90vw}
#toast.on{opacity:1}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{background:#fff;border-radius:12px;padding:22px;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-top:6px solid var(--red)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.seg button{border:0;background:#fff;padding:8px 14px;font-weight:700;font-size:13px}
.seg button.on{background:var(--ink);color:#fff}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:14px}
.chk input{width:18px;height:18px;accent-color:var(--red)}
.dot{width:10px;height:10px;border-radius:50%;background:#bbb;display:inline-block}
.dot.on{background:var(--ok)}
/* home */
.home{flex:1;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(#fff 0 62%,var(--ink) 62% 100%)}
.joinbox{width:100%;max-width:400px;background:#fff;border:3px solid var(--ink);border-radius:12px;padding:26px;text-align:center;box-shadow:8px 8px 0 var(--red)}
.joinbox h1{font-size:30px;margin-bottom:4px}
.pinin{font-size:30px;font-weight:900;letter-spacing:.25em;text-align:center;padding:12px}
.namein{font-size:20px;font-weight:700;text-align:center}
/* editor */
.qcard{border:2px solid var(--line);border-left:6px solid var(--ink);border-radius:8px;padding:14px;margin-bottom:14px;background:#fff}
.qcard.bad{border-left-color:var(--red)}
.qhead{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.qnum{font-weight:900;font-size:18px;min-width:38px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.opt{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:6px;padding:4px 8px}
.opt .ltr{width:28px;height:28px;border-radius:5px;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex:none}
.opt input[type=text]{border:0;outline:0;flex:1;min-width:0;padding:6px 2px;background:transparent}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--ok)}
.thumb{max-height:90px;border-radius:6px;border:1px solid var(--line)}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
/* host stage */
.stage{flex:1;display:flex;flex-direction:column;background:#fff;min-height:0}
.hud{display:flex;align-items:center;gap:14px;padding:8px 18px;background:var(--ink);color:#fff;font-weight:700;font-size:15px}
.hud .pin{background:#fff;color:var(--ink);padding:2px 10px;border-radius:5px;font-weight:900;letter-spacing:.1em}
.hud .btn{border-color:#fff;background:transparent;color:#fff}
.hud .btn:hover{background:rgba(255,255,255,.15)}
.hud .btn.pri{background:var(--red);border-color:var(--red)}
.hud .seg{border-color:#fff}.hud .seg button{background:transparent;color:#fff;padding:5px 10px}.hud .seg button.on{background:#fff;color:var(--ink)}
.qstage .tile{min-height:13vh}
.lobby{flex:1;display:grid;grid-template-columns:minmax(300px,420px) 1fr;min-height:0}
.lobL{background:var(--soft);padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;border-right:3px solid var(--ink);text-align:center}
.lobL .url{font-weight:700;font-size:15px;word-break:break-all}
.bigpin{font-size:clamp(46px,7vw,84px);font-weight:900;letter-spacing:.08em;line-height:1;color:var(--red)}
.qr{background:#fff;padding:8px;border:3px solid var(--ink);border-radius:8px;line-height:0}
.qr svg{width:210px;height:210px}
.lobR{padding:22px;overflow:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{border:2px solid var(--ink);border-radius:99px;padding:6px 14px;font-weight:700;background:#fff}
.chip.new{animation:pop .3s}
.chip:hover{background:var(--red);border-color:var(--red);color:#fff;text-decoration:line-through}
.chip i{font-style:normal;font-size:11px;opacity:.7;margin-left:6px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.qstage{flex:1;display:flex;flex-direction:column;padding:18px 22px;gap:14px;min-height:0}
.qtext{font-size:clamp(24px,3.6vw,46px);font-weight:900;text-align:center;line-height:1.2;padding:8px 0}
.qmid{flex:1;display:flex;align-items:center;justify-content:center;gap:28px;min-height:120px}
.qmid img{max-height:38vh;max-width:60vw;border-radius:10px;border:3px solid var(--ink)}
.clock{width:120px;height:120px;border-radius:50%;border:8px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;flex:none}
.clock.low{border-color:var(--red);color:var(--red)}
.cnt{text-align:center;flex:none}
.cnt b{display:block;font-size:48px;font-weight:900;line-height:1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:10px;color:#fff;font-weight:700;font-size:clamp(17px,2.1vw,28px);min-height:76px;border:0;text-align:left;position:relative}
.tile svg{width:38px;height:38px;flex:none;fill:#fff}
.tile .lt{font-weight:900;font-size:1.1em;opacity:.9}
.t0{background:var(--c0)}.t1{background:var(--c1)}.t2{background:var(--c2)}.t3{background:var(--c3)}
.tile.dim{opacity:.28}
.tile .num{margin-left:auto;font-weight:900;font-size:1.2em;background:rgba(255,255,255,.2);padding:2px 12px;border-radius:6px}
.tile.okk::after{content:"✓";position:absolute;right:-8px;top:-10px;background:var(--ok);color:#fff;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;border:3px solid #fff}
.bars{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:30vh;min-height:150px}
.barc{width:90px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.barc b{font-size:24px;font-weight:900}
.barc div{width:100%;border-radius:6px 6px 0 0;min-height:6px;transition:height .5s}
.board{flex:1;width:100%;max-width:820px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:10px;justify-content:center}
.brow{display:flex;align-items:center;gap:14px;border:3px solid var(--ink);border-radius:10px;padding:12px 18px;font-size:24px;font-weight:700;background:#fff;animation:pop .3s}
.brow:first-of-type{background:var(--ink);color:#fff}
.brow .rk{font-weight:900;width:44px}
.brow .sc{margin-left:auto;font-weight:900}
.brow .gn{font-size:15px;color:var(--ok);font-weight:900}
.podium{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:20px 20px 0;min-height:300px}
.pod{width:min(26vw,240px);text-align:center;animation:rise .8s both}
.pod .nm{font-size:clamp(16px,2.2vw,28px);font-weight:900;word-break:break-word}
.pod .sc{font-weight:700;margin-bottom:8px}
.pod .blk{background:var(--ink);color:#fff;font-size:64px;font-weight:900;border-radius:10px 10px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:14px}
.pod.p1 .blk{height:230px;background:var(--red)}.pod.p2 .blk{height:165px}.pod.p3 .blk{height:115px;background:#55525A}
.pod.p2{animation-delay:.5s}.pod.p3{animation-delay:.1s}.pod.p1{animation-delay:1s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;text-align:center}
.ready .n{font-size:16px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--red)}
.prog{height:10px;background:var(--line);border-radius:99px;overflow:hidden;width:min(600px,80vw)}
.prog i{display:block;height:100%;background:var(--red);width:100%}
@media(max-width:800px){.lobby{grid-template-columns:1fr}.lobL{border-right:0;border-bottom:3px solid var(--ink)}}
/* player */
.pl{flex:1;display:flex;flex-direction:column;min-height:100dvh;background:#fff}
.pltop{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--ink);color:#fff;font-weight:700;font-size:14px}
.pltop .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plmid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;gap:14px}
.plmid h1{font-size:30px}
.plq{padding:12px 14px;font-weight:700;font-size:17px;text-align:center;border-bottom:2px solid var(--line)}
.pltiles{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.pltiles.two{grid-template-columns:1fr}
.pltiles .tile{flex-direction:column;justify-content:center;text-align:center;font-size:17px;gap:8px;padding:10px;min-height:110px;word-break:break-word}
.pltiles .tile svg{width:44px;height:44px}
.pltiles .tile.sel{outline:5px solid #fff;outline-offset:-9px}
.pltiles .tile:active{filter:brightness(.85)}
.pbar{height:8px;background:var(--line)}
.pbar i{display:block;height:100%;background:var(--red)}
.big-ic{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:60px;color:#fff;font-weight:900}
.res-ok{background:var(--ok)}.res-no{background:var(--red)}.res-na{background:#77747C}
.fullc{color:#fff}
.fullc.okb{background:var(--ok)}.fullc.nob{background:var(--red)}.fullc.nab{background:#55525A}
.pts{font-size:26px;font-weight:900;background:rgba(0,0,0,.25);padding:6px 18px;border-radius:8px}
.plfoot{display:flex;justify-content:space-between;padding:12px 16px;background:var(--soft);font-weight:900;border-top:3px solid var(--ink)}
.teams{display:grid;gap:8px;width:100%;max-width:340px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
</style>
</head>

<div id="toast"></div>
<script>//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/

// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php

// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html

//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;

function validQ(q) {

}
const X_W = [60, 14, 26, 26, 26, 26, 14, 16, 18];

function downloadTemplate() {
  const guide = LANG === 'vi' ? [['Hướng dẫn'],
  ['Mỗi dòng trong sheet "Questions" là một câu hỏi. Không xóa dòng tiêu đề.'],

  ['Đáp án đúng: với quiz ghi A, B, C hoặc D (nhiều đáp án đúng: A,C). Với tf ghi T (Đúng) hoặc F (Sai).'],

function rowsToQuestions(rows) {
  const out = [];
  rows.slice(1).forEach(r => {
    const g = i => String(r[i] == null ? '' : r[i]).trim();
    const text = g(0); if (!text) return;
    const ty = g(1).toLowerCase(), cr = g(6).toUpperCase();
    const isTF = /^(tf|t\/f|true|đúng|dung|đ\/s)/.test(ty) || (!g(2) && !g(3) && /^(T|F|TRUE|FALSE|ĐÚNG|SAI|DUNG|Đ|S)$/.test(cr));
    let time = parseInt(g(7), 10); if (!(time >= 5 && time <= 240)) time = 20;
    const pv = g(8).toLowerCase(); const pts = /^(0|none|không|khong)/.test(pv) ? 0 : /^(2000|2|double|gấp)/.test(pv) ? 2 : 1;
    if (isTF) out.push({ id: rid(6), type: 'tf', text, opts: ['', '', '', ''], correct: [/^(T|TRUE|ĐÚNG|DUNG|Đ|1|A)$/.test(cr) ? 0 : 1], time, pts, img: '' });
    else {
      const opts = [g(2), g(3), g(4), g(5)];
      const correct = [...new Set(cr.split(/[^A-D1-4]+/).filter(Boolean).map(c => /[1-4]/.test(c[0]) ? +c[0] - 1 : c.charCodeAt(0) - 65))].filter(i => i >= 0 && i < 4 && opts[i]);
      out.push({ id: rid(6), type: 'quiz', text, opts, correct, time, pts, img: '' });
    }
  });
  return out;
}
async function importFile(file) {

    if (!qs.length) throw new Error('empty');
    QUIZZES.unshift({ id: rid(8), title: file.name.replace(/\.xlsx$/i, ''), updated: Date.now(), questions: qs });
    saveQuizzes(); toast(`${t('imported')}: ${qs.length} ${t('questions')}`); render();
  } catch (e) { console.error(e); toast(t('importFail')); }
}

    phase: 'lobby', qi: -1, locked: false, players: {}, nextN: 1, created: Date.now(), seq: 0, scored: -1, res: null, tEnd: 0

/* ---------- messages ---------- */
function ack(a) { ackQ.push(a); if (!ackT) ackT = setTimeout(() => { ackT = null; const b = ackQ; ackQ = []; if (HRT) HRT.send(topicDn(G.pin), 'k', { gid: G.gid, a: b }); }, 350); }
function onJoin(m) {
  if (!m || typeof m.pid !== 'string' || m.pid.length < 12) return;
  const h = m.pid.slice(0, 8); let p = G.players[m.pid];
  if (p) { ack(p.kicked ? { h, err: 'kicked' } : { h, n: p.n, name: p.name, team: p.team }); return; }
  if (G.phase === 'podium' || G.phase === 'closed') return;
  if (G.locked) { ack({ h, err: 'locked' }); return; }
  let name = String(m.name || '').replace(/\s+/g, ' ').trim().slice(0, 16);
  if (!name) { ack({ h, err: 'name' }); return; }
  const taken = new Set(active().map(x => x.name.toLowerCase()));
  if (taken.has(name.toLowerCase())) { let k = 2; while (taken.has((name.slice(0, 13) + ' ' + k).toLowerCase())) k++; name = name.slice(0, 13) + ' ' + k; }
  let team = -1;
  if (G.opts.team) {
    const nt = G.opts.teams.length;
    if (G.opts.assign === 'choose' && Number.isInteger(m.team) && m.team >= 0 && m.team < nt) team = m.team;
    else { const cnt = Array(nt).fill(0); active().forEach(x => { if (x.team >= 0) cnt[x.team]++; }); team = cnt.indexOf(Math.min(...cnt)); }
  }
  p = G.players[m.pid] = { n: G.nextN++, name, team, score: 0, streak: 0, tms: 0, kicked: false, ans: [], at: Date.now() };
  ack({ h, n: p.n, name: p.name, team: p.team });

}
const answeredCount = () => active().filter(p => p.ans[G.qi]).length;
function onAnswer(m) {
  if (G.phase !== 'answer' || !m || m.qi !== G.qi) return;
  const p = G.players[m.pid]; if (!p || p.kicked || p.ans[G.qi]) return;
  const q = G.qs[G.qi], now = Date.now(); if (now > G.tEnd + GRACE_MS) return;
  const lim = q.time * 1000, hostMs = now - (G.tEnd - lim);
  let ms = Number(m.ms); if (!(ms >= 0)) ms = hostMs;
  ms = Math.round(Math.min(lim, Math.max(0, ms, hostMs - 4000)));
  let c = Array.isArray(m.c) ? [...new Set(m.c.map(Number))].filter(i => Number.isInteger(i) && i >= 0 && i < nOpts(q)).sort((a, b) => a - b) : [];
  if (!c.length) return;
  if (q.correct.length === 1) c = c.slice(0, 1);
  const cor = q.correct.slice().sort((a, b) => a - b);
  const ok = c.length === cor.length && c.every((v, i) => v === cor[i]);
  p.ans[G.qi] = { c, ms, ok, pts: ok ? Math.round((1 - (ms / lim) / 2) * 1000 * q.pts) : 0 };
  saveSoon(); pushSoon();
  const n = answeredCount(), e = $('#acnt'); if (e) e.textContent = n + ' / ' + active().length;
  if (n >= active().length) setTimeout(() => { if (G && G.phase === 'answer') doReveal(); }, 500);
}

/* ---------- state broadcast ---------- */
function buildState() {
  const q = G.qs[G.qi];
  const s = { gid: G.gid, seq: ++G.seq, ph: G.phase, qi: G.qi, total: G.qs.length, title: G.title, locked: G.locked, teams: G.opts.team ? G.opts.teams : null, assign: G.opts.assign, kick: Object.values(G.players).filter(p => p.kicked).map(p => p.n) };
  if (q && ['ready', 'answer', 'reveal', 'board'].includes(G.phase)) s.q = { text: q.text, type: q.type, opts: q.type === 'tf' ? null : q.opts, time: q.time, multi: q.correct.length > 1 };
  if (G.phase === 'ready' || G.phase === 'answer') s.left = Math.max(0, G.tEnd - Date.now());
  if (G.phase === 'answer') s.ans = active().filter(p => p.ans[G.qi]).map(p => p.n);
  if (['reveal', 'board', 'podium'].includes(G.phase)) s.res = G.res;

}

function pushSoon() { if (pushT) return; pushT = setTimeout(() => { pushT = null; pushState(); }, 900); }

/* ---------- phases ---------- */
function ranked() { return active().sort((a, b) => b.score - a.score || a.tms - b.tms || a.n - b.n); }
function teamStats(g) {
  g = g || G;
  return g.opts.teams.map((name, i) => { const ms = Object.values(g.players).filter(p => !p.kicked && p.team === i); const tot = ms.reduce((a, p) => a + p.score, 0); return { i, name, n: ms.length, total: tot, avg: ms.length ? Math.round(tot / ms.length) : 0 }; });
}
function startReady(qi) { G.qi = qi; G.phase = 'ready'; G.tEnd = Date.now() + READY_MS; G.res = null; saveGame(); pushState(); render(); }
function startAnswer() { const q = G.qs[G.qi]; G.phase = 'answer'; G.tEnd = Date.now() + q.time * 1000; lastTickSec = -1; saveGame(); pushState(); render(); }
function computeRes() {
  const q = G.qs[G.qi], act = active();
  if (G.scored !== G.qi) {
    act.forEach(p => { const a = p.ans[G.qi]; if (a && a.ok) { p.score += a.pts; p.streak++; } else p.streak = 0; p.tms += a ? a.ms : q.time * 1000; });
    G.scored = G.qi;

  G.res = { correct: q.correct, r, np: act.length };

  else if (G.phase === 'board') startReady(G.qi + 1);
}

  if (!G.res) { const r = {}; ranked().forEach((p, i) => { r[p.n] = [0, p.score, i + 1, -1, p.streak]; }); G.res = { correct: [], r, np: active().length }; if (G.opts.team) G.res.tr = teamStats().map(x => x.avg); }
  G.phase = 'podium'; G.ended = Date.now();

}
function hostTick() {

function reportSheets(g) {
  const pls = Object.values(g.players).filter(p => !p.kicked).sort((a, b) => b.score - a.score || a.tms - b.tms || a.n - b.n);
  const tm = g.opts.team, tn = p => tm ? (g.opts.teams[p.team] || '') : '';
  const lab = (q, i) => q.type === 'tf' ? (i === 0 ? t('tfT') : t('tfF')) : LETTERS[i] + '. ' + q.opts[i];
  const played = g.qs.filter((_, i) => i <= g.scored);
  const sum = [[g.title], [new Date(g.created).toLocaleString(LANG === 'vi' ? 'vi-VN' : 'en-GB'), 'PIN ' + g.pin, pls.length + ' ' + t('players')], [],
  [t('cRank'), t('cNick')].concat(tm ? [t('cTeam')] : [], [t('cScore'), t('cCorrect'), t('cTotalQ'), t('cPct'), t('cAvgT')])];
  pls.forEach((p, i) => {
    const as = played.map((_, k) => p.ans[k]).filter(Boolean), ok = as.filter(a => a.ok).length;
    sum.push([i + 1, p.name].concat(tm ? [tn(p)] : [], [p.score, ok, played.length, played.length ? Math.round(ok / played.length * 100) : 0, as.length ? +(as.reduce((s, a) => s + a.ms, 0) / as.length / 1000).toFixed(1) : '']));
  });
  const det = [[t('cNick')].concat(tm ? [t('cTeam')] : [], [t('cQ'), t('cQuestion'), t('cAnswer'), t('cIsOk'), t('cTime'), t('cPts')])];
  pls.forEach(p => played.forEach((q, k) => { const a = p.ans[k]; det.push([p.name].concat(tm ? [tn(p)] : [], [k + 1, q.text, a ? a.c.map(c => lab(q, c)).join('; ') : '', a ? (a.ok ? t('cOk') : t('cNo')) : t('noAns'), a ? +(a.ms / 1000).toFixed(1) : '', a ? a.pts : 0])); }));
  const qs = [[t('cQ'), t('cQuestion'), t('cRight'), t('cAnswered'), t('cCorrect'), t('cPct'), 'A', 'B', 'C', 'D']];
  played.forEach((q, k) => {
    const as = pls.map(p => p.ans[k]).filter(Boolean), ok = as.filter(a => a.ok).length, cnt = [0, 1, 2, 3].map(i => i < nOpts(q) ? as.filter(a => a.c.includes(i)).length : '');
    qs.push([k + 1, q.text, q.correct.map(c => lab(q, c)).join('; '), as.length, ok, pls.length ? Math.round(ok / pls.length * 100) : 0].concat(cnt));
  });
  const sheets = [{ name: t('rSummary'), rows: sum, header: 3, widths: [8, 26, 18, 12, 14, 14, 10, 20] }, { name: t('rDetail'), rows: det, widths: tm ? [24, 16, 6, 50, 36, 12, 14, 10] : [24, 6, 50, 36, 12, 14, 10] }, { name: t('rQuestions'), rows: qs, widths: [6, 50, 36, 18, 14, 10, 8, 8, 8, 8] }];
  if (tm) {

    sheets.push({ name: t('rTeams'), rows: [[t('cRank'), t('cTeam'), t('members'), t('avg'), t('cScore')]].concat(ts.map((x, i) => [i + 1, x.name, x.n, x.avg, x.total])), widths: [8, 24, 14, 14, 14] });
  }

}

function sendJoin() { P.lastJoin = Date.now(); P.tries++; restSend(topicUp(P.pin), 'j', { pid: P.pid, name: P.name, team: P.team }); }

const ord = n => LANG === 'vi' ? `${t('rank')} ${n}` : `${n}${['th', 'st', 'nd', 'rd'][(n % 100 > 10 && n % 100 < 14) ? 0 : (n % 10 < 4 ? n % 10 : 0)]} place`;

    case 's-tc': { const n = +el.dataset.v, d = defTeams(n); MODAL.opts.teams = d.map((x, i) => MODAL.opts.teams[i] || x); render(); break; }
    case 's-as': MODAL.opts.assign = el.dataset.v; render(); break;
    case 's-create': { const m = MODAL; MODAL = null; if (G) { if (HRT) HRT.close(); HRT = null; } newGame(m.quiz, m.opts); break; }
    case 'addq': EDIT.questions.push(blankQ('quiz')); editSave(); render(); window.scrollTo(0, document.body.scrollHeight); break;
    case 'addtf': EDIT.questions.push(blankQ('tf')); editSave(); render(); window.scrollTo(0, document.body.scrollHeight); break;
    case 'rep-dl': downloadReport(LS.get('mkq.reports', [])[+el.dataset.i]); break;
    case 'rep-del': ask(t('del') + '?', () => { const r = LS.get('mkq.reports', []); r.splice(+el.dataset.i, 1); LS.set('mkq.reports', r); }); break;
    case 'kick': { const p = G.players[el.dataset.pid]; if (p) { p.kicked = true; saveGame(); pushState(); render(); } break; }
    case 'g-lock': G.locked = !G.locked; saveGame(); pushState(); render(); break;
    case 'g-cancel': ask(t('confirmCancel'), closeGame); break;
    case 'g-next': hostNext(); break;
    case 'g-end': ask(t('confirmEnd'), toPodium); break;
    case 'g-sound': SOUND = !SOUND; LS.set('mkq.sound', SOUND); render(); break;
    case 'g-full': if (document.fullscreenElement) document.exitFullscreen(); else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => { }); break;
    case 'g-report': downloadReport(G); break;
    case 'g-close': closeGame(); break;
    case 'p-team': P.team = +el.dataset.v; P.name = ($('#pname').value || P.name); P.err = ''; playerRender(); break;
    case 'p-go': goName(); break;
    case 'p-ans': { const i = +el.dataset.v; if (P.st.q.multi) { P.sel = P.sel.includes(i) ? P.sel.filter(x => x !== i) : P.sel.concat(i).sort(); playerRender(); } else playerAnswer([i]); break; }
    case 'p-submit': if (P.sel.length) playerAnswer(P.sel.slice()); break;
    case 'p-retry': { const pin = P.pin; playerStop(); playerStart(pin); playerRender(); break; }
    case 'p-leave': case 'p-home': LS.del('mkq.player'); playerStop(); location.hash = '#/'; render(); break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'hpin') { el.value = el.value.replace(/\D/g, '').slice(0, 6); return; }
  if (MODAL && MODAL.kind === 'setup') { if (el.dataset.tn != null) MODAL.opts.teams[+el.dataset.tn] = el.value; if (el.dataset.so) MODAL.opts[el.dataset.so] = el.checked; return; }
  if (!EDIT) return;
  if (el.id === 'qtitle') { EDIT.title = el.value; editSave(); return; }
  const card = el.closest('.qcard'); if (!card) return;
  const i = +card.dataset.qi, q = EDIT.questions[i];
  if (el.dataset.f === 'text') q.text = el.value;
  else if (el.dataset.o != null) q.opts[+el.dataset.o] = el.value;
  else return;
  editSave(); refreshCard(i);
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'xfile' && el.files[0]) { importFile(el.files[0]); el.value = ''; return; }
  if (el.id === 'imgfile' && el.files[0] && EDIT && imgTarget >= 0) { loadImage(el.files[0], d => { EDIT.questions[imgTarget].img = d; EDIT.updated = Date.now(); if (!saveQuizzes()) EDIT.questions[imgTarget].img = ''; render(); }); el.value = ''; return; }
  if (!EDIT) return;
  const card = el.closest('.qcard'); if (!card) return;
  const i = +card.dataset.qi, q = EDIT.questions[i];
  if (el.dataset.f === 'type') { q.type = el.value; q.correct = el.value === 'tf' ? [0] : []; editSave(); render(); }
  else if (el.dataset.f === 'time') { q.time = +el.value; editSave(); }
  else if (el.dataset.f === 'pts') { q.pts = +el.value; editSave(); }
  else if (el.dataset.c != null) { const c = +el.dataset.c; q.correct = el.checked ? [...new Set(q.correct.concat(c))].sort() : q.correct.filter(x => x !== c); editSave(); refreshCard(i); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'hpin') { goJoin(); return; }
  if (e.key === 'Enter' && e.target.id === 'pname') { goName(); return; }
  if (route().a === 'game' && G && !MODAL && ['ArrowRight', 'PageDown', ' '].includes(e.key) && (G.phase === 'reveal' || G.phase === 'board')) { e.preventDefault(); hostNext(); }
});
document.documentElement.lang = LANG;
render();
</script>
</body>
